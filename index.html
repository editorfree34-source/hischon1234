<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>חיסכון שלי</title>
<meta name="theme-color" content="#0F766E">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חיסכון שלי">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6EC;--card:#FFFDF8;--teal:#0F766E;--tealD:#0B5C56;--tealL:#D5EAE6;--or:#F59E0B;--ink:#1F2A2E;--mut:#5F686C;--line:#EADFC8;--red:#B42318;--btn:#0F766E;--hero:#0F766E;--inp:#fff;--bdg:#FDEBC8;--bdgT:#7A4A00;color-scheme:light}
:root[data-theme=dark]{--bg:#0E1A1B;--card:#152527;--teal:#3DBBAD;--tealD:#9BE0D8;--tealL:#1C3A3B;--ink:#E7EEEE;--mut:#9DB0B2;--line:#26403F;--red:#F97066;--btn:#0F766E;--hero:#115E59;--inp:#0E1A1B;--bdg:#3A2E12;--bdgT:#F5C76B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Heebo,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:14px 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand svg{width:38px;height:38px;flex:none}
.brand{display:flex;align-items:center;gap:10px;flex:1;font-size:20px;font-weight:600;color:var(--teal);background:none;border:0;padding:0;text-align:start}
.ib.sq{width:40px;padding:0;display:grid;place-items:center}
.ib{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:14px}
h1{font-size:22px;margin:0 0 14px;font-weight:700}
h2{margin:0 0 6px;font-size:20px;font-weight:700}
.sum{background:var(--hero);color:#fff;border-radius:14px;padding:20px;margin-bottom:18px}
.sum small{display:block;opacity:.8;font-size:14px}
.sum .big{font-size:34px;font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.sum .bar{background:rgba(255,255,255,.22);margin-top:14px}.sum .bar i{background:#fff}
.sum .two{display:flex;gap:32px;margin-top:14px}
.sum .two b{font-weight:700;overflow-wrap:anywhere}
.icons small{font-size:12px;color:var(--mut)}
@keyframes grow{from{width:0}}.first .bar i{animation:grow .9s ease}
.tabs{display:flex;gap:22px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-radius:0;padding:8px 2px;color:var(--mut);font-weight:500}
.tab[aria-pressed=true]{border-bottom-color:var(--teal);color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:start;box-shadow:0 1px 2px rgba(31,42,46,.05)}
.goal{cursor:pointer;display:flex;flex-direction:column;gap:10px}
.goal{transition:transform .15s,border-color .15s}.goal:hover{border-color:var(--teal);transform:translateY(-2px)}.goal.done{border-color:var(--or)}
.btn:active,.tab:active{transform:scale(.97)}
.hint{color:var(--mut);margin:-8px 0 16px;font-size:15px;overflow-wrap:anywhere}
.prev{min-height:22px;margin-top:8px;color:var(--teal);font-weight:600;font-size:15px}
.badge.ok{background:var(--tealL);color:var(--tealD)}
.row{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;border-radius:12px;background:var(--tealL);color:var(--teal);display:grid;place-items:center;flex:none}
.gt{flex:1;min-width:0}
.gt h3{margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gt small,.mut{color:var(--mut)}
.pc{font-size:17px;font-weight:700;color:var(--teal)}
.bar{height:8px;background:var(--tealL);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .6s ease}
.bar.done i{background:var(--or)}
.nums{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mut)}
.nums b{color:var(--ink);overflow-wrap:anywhere}
.badge{font-size:12px;background:var(--bdg);border-radius:99px;padding:2px 10px;font-weight:700;color:var(--bdgT)}
.btn{border:0;border-radius:8px;padding:11px 18px;font-weight:600;background:var(--tealL);color:var(--tealD);min-height:46px}
.btn.pri{background:var(--btn);color:#fff}
.btn.or{background:var(--or);color:#2A1B00}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.bad{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn:disabled{opacity:.6}
.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);box-shadow:0 6px 18px rgba(15,118,110,.25);padding:13px 26px;border-radius:12px;font-size:16px}
.empty{text-align:center;padding:36px 20px}
.empty svg{width:56px;height:56px;margin-bottom:6px}
.empty p{color:var(--mut);max-width:34ch;margin:8px auto 18px}
.ov{position:fixed;inset:0;background:rgba(31,42,46,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
label{display:block;font-weight:500;margin:12px 0 0}
input,select,textarea{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--inp)}
.q{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.q button{flex:1;min-width:64px;padding:12px 8px;border-radius:12px;border:1px solid var(--teal);background:var(--inp);font-weight:700;color:var(--tealD)}
.q button.on{background:var(--btn);color:#fff}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.icons label{margin:0}
.icons input{position:absolute;opacity:0;width:0}
.icons span{display:grid;place-items:center;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--teal);cursor:pointer}
.icons input:checked+span{border:2px solid var(--teal);background:var(--tealL)}
.icons input:focus-visible+span{outline:3px solid var(--or)}
.err{color:var(--red);font-weight:500;min-height:22px;margin-top:8px}
.mg .btn{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}.mg .btn.bad{border-color:var(--red);color:var(--red)}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1}
.ringbox{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .tr{stroke:var(--tealL)}
.ring .pg{stroke:var(--teal);stroke-linecap:round;transition:stroke-dashoffset .7s ease;transform:rotate(-90deg);transform-origin:center}
.ring.done .pg{stroke:var(--or)}
.ring text{font-size:24px;font-weight:700;fill:var(--ink)}
.hist{list-style:none;margin:8px 0 0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hist .am{font-weight:700;min-width:0;overflow-wrap:anywhere}
.hist .dep{color:var(--teal)}.hist .wd{color:var(--red)}
.hist .mid{flex:1;min-width:0;font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.lk{border:0;background:none;color:var(--teal);font-weight:700;padding:8px 6px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;z-index:30;max-width:90vw;text-align:center;font-weight:500}
#toast.err{background:var(--red)}
.cele{text-align:center}
.cele svg{width:64px;height:64px;color:var(--teal);animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;z-index:20;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast" hidden></div>
<script>
const IC={laptop:'<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',phone:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',car:'<path d="M4 16v-4l2-5h12l2 5v4z"/><path d="M4 12h16"/><circle cx="8" cy="17" r="1.5"/><circle cx="16" cy="17" r="1.5"/>',plane:'<path d="M3 13l18-8-6 15-3-6z"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c3 2.5 9 2.5 12 0v-4.5"/>',home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',gift:'<rect x="3" y="8" width="18" height="4"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8c-3 0-4-4-1.5-4S12 8 12 8zM12 8c3 0 4-4 1.5-4S12 8 12 8z"/>',camera:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',bike:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8H8"/>',star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>'},ICONS=Object.keys(IC),ico=k=>k==='none'?'':`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||IC.target}</svg>`;
const KEY='hisachon-v1',CATS=['טכנולוגיה','רכב','חופשה','לימודים','בית','אחר'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>r2(n).toLocaleString('he-IL',{maximumFractionDigits:2})+' ₪';
const parseAmt=v=>{const n=Number(String(v).replace(/[,\s₪]/g,''));return isFinite(n)&&String(v).trim()!==''?r2(n):NaN};
const tot=tx=>r2(tx.reduce((a,t)=>a+(t.type==='wd'?-t.amount:t.amount),0));
const saved=g=>tot(g.tx),left=g=>Math.max(0,r2(g.target-saved(g)));
const pct=g=>{const s=saved(g);return s>=g.target?100:Math.max(0,Math.min(99,Math.floor(s/g.target*100)))};
const G=id=>S.goals.find(g=>g.id===id);
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.goals))return d}catch(e){}return{v:1,goals:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('השמירה נכשלה. ייצא גיבוי מההגדרות.',1)}}
let S=load(),ui={tab:'active',view:'home',gid:null},cb=null,lastSub=0,tt;
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'err':'';t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
const logo=()=>`<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#0F766E"/><circle cx="20" cy="20" r="9" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3.5"/><path d="M20 11A9 9 0 1 1 11 20" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><circle cx="11" cy="20" r="2.2" fill="#F59E0B"/></svg>`;
const head=()=>`<div class="top"><button class="brand" data-act="home" aria-label="חיסכון שלי, חזרה למסך הבית">${logo()}<span>חיסכון שלי</span></button><button class="ib sq" data-act="theme" aria-label="החלפה בין מצב בהיר למצב כהה">${thIco()}</button><button class="ib" data-act="settings">הגדרות</button></div>`;
function greet(){const h=new Date().getHours();return h<5||h>=21?'לילה טוב':h<12?'בוקר טוב':h<18?'צהריים טובים':'ערב טוב'}
function card(g){const p=pct(g);return `<article class="card goal${p>=100?' done':''}" data-act="open" data-id="${g.id}"><div class="row">${g.icon==='none'?'':`<span class="ico">${ico(g.icon)}</span>`}<div class="gt"><h3>${esc(g.name)}</h3><small>${esc(g.cat)} ${g.status==='paused'?'<span class="badge">מושהה</span>':mile(p)?`<span class="badge ok">${mile(p)}</span>`:''}</small></div><b class="pc">${p}%</b></div><div class="bar ${p>=100?'done':''}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i data-k="${g.id}" data-p="${p}" style="width:${p}%"></i></div><div class="nums"><span><b>${fmt(saved(g))}</b> מתוך ${fmt(g.target)}</span><span>נותר <b>${fmt(left(g))}</b></span></div>${g.status==='active'||g.status==='paused'?`<button class="btn" data-act="add" data-id="${g.id}">הוסף כסף</button>`:''}</article>`}
function home(){
 const vis=S.goals.filter(g=>g.status!=='archived'),act=S.goals.filter(g=>g.status==='active'),op=act.length?Math.min(100,Math.floor(act.reduce((a,g)=>a+Math.min(saved(g),g.target),0)/act.reduce((a,g)=>a+g.target,0)*100)):0;
 const counts={active:S.goals.filter(g=>g.status==='active'||g.status==='paused').length,completed:S.goals.filter(g=>g.status==='completed').length,archived:S.goals.filter(g=>g.status==='archived').length};
 if(!S.goals.length)return head()+`<div class="card empty">${logo()}<h2>${greet()}, בוא נתחיל לחסוך</h2><p>צור את היעד הראשון שלך, למשל מחשב חדש או חופשה, ועקוב אחרי ההתקדמות.</p><button class="btn pri" data-act="new">צור יעד ראשון</button></div>`;
 const list=S.goals.filter(g=>ui.tab==='active'?(g.status==='active'||g.status==='paused'):g.status===ui.tab);
 const names={active:'פעילים',completed:'הושלמו',archived:'ארכיון'};
 const msg={active:'אין יעדים פעילים כרגע.',completed:'עוד לא השלמת יעדים. אתה בדרך!',archived:'הארכיון ריק.'}[ui.tab];
 return head()+`<h1>${greet()}</h1>${hint()}<div class="sum"><small>סך החיסכון</small><div class="big">${fmt(vis.reduce((a,g)=>a+saved(g),0))}</div>${act.length?`<div class="bar" role="progressbar" aria-valuenow="${op}" aria-valuemin="0" aria-valuemax="100"><i style="width:${op}%"></i></div>`:''}<div class="two"><div><small>נותר להשגה</small><b>${fmt(act.reduce((a,g)=>a+left(g),0))}</b></div><div><small>יעדים פעילים</small><b>${act.length}</b></div></div></div>
 <div class="tabs">${Object.keys(names).map(k=>`<button class="tab" data-act="tab" data-v="${k}" aria-pressed="${ui.tab===k}">${names[k]} (${counts[k]})</button>`).join('')}</div>
 ${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="card empty"><p>${msg}</p></div>`}
 <button class="btn pri fab" data-act="new">+ יעד חדש</button>`}
function detail(){
 const g=G(ui.gid);if(!g){ui.view='home';return home()}
 const p=pct(g),C=2*Math.PI*52,st=g.status,hist=g.tx.slice().sort((a,b)=>b.date.localeCompare(a.date));
 const date=g.date?new Date(g.date+'T00:00:00').toLocaleDateString('he-IL'):'';
 return head()+`<button class="lk" data-act="back">→ חזרה</button><div class="card"><div class="row">${g.icon==='none'?'':`<span class="ico">${ico(g.icon)}</span>`}<div class="gt"><h2>${esc(g.name)}</h2><small>${esc(g.cat)}${date?' · עד '+date:''} ${st==='paused'?'<span class="badge">מושהה</span>':''}${st==='completed'?'<span class="badge">הושלם</span>':''}${st==='archived'?'<span class="badge">בארכיון</span>':''}</small></div></div>
 ${g.note?`<p class="mut" style="overflow-wrap:anywhere">${esc(g.note)}</p>`:''}
 <div class="ringbox" style="margin-top:14px"><svg class="ring ${p>=100?'done':''}" viewBox="0 0 132 132" role="img" aria-label="${p}%"><circle class="tr" cx="66" cy="66" r="52"/><circle class="pg" data-k="${g.id}" data-p="${p}" cx="66" cy="66" r="52" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/><text x="66" y="76" text-anchor="middle">${p}%</text></svg>
 <div class="nums" style="flex-direction:column;flex:1;min-width:150px;font-size:16px"><span>נחסך <b>${fmt(saved(g))}</b></span><span>נותר <b>${fmt(left(g))}</b></span><span>יעד <b>${fmt(g.target)}</b></span></div></div>
 ${st==='active'||st==='paused'?`<div class="acts"><button class="btn pri" data-act="add" data-id="${g.id}">הוסף כסף</button><button class="btn" data-act="wd" data-id="${g.id}">רשום משיכה</button></div>`:''}</div>
 <div class="card" style="margin-top:14px"><h2>היסטוריה</h2>${hist.length?`<ul class="hist">${hist.map(t=>`<li><span class="am ${t.type}">${t.type==='wd'?'−':'+'}${fmt(t.amount)}</span><span class="mid">${new Date(t.date).toLocaleDateString('he-IL')}${t.note?' · '+esc(t.note):''}</span><button class="lk" data-act="txedit" data-id="${t.id}" data-type="${t.type}">עריכה</button><button class="lk" style="color:var(--red)" data-act="txdel" data-id="${t.id}">מחיקה</button></li>`).join('')}</ul>`:'<p class="mut">עוד אין הפקדות. לחץ על "הוסף כסף" כדי להתחיל.</p>'}</div>
 <div class="card mg" style="margin-top:14px"><h2>ניהול היעד</h2><div class="acts"><button class="btn" data-act="edit" data-id="${g.id}">עריכת יעד</button>
 ${st==='active'?`<button class="btn" data-act="pause" data-id="${g.id}">השהה</button><button class="btn" data-act="complete" data-id="${g.id}">סמן כהושלם</button>`:''}
 ${st==='paused'||st==='completed'?`<button class="btn" data-act="resume" data-id="${g.id}">החזר לפעיל</button>`:''}
 ${st==='completed'?`<button class="btn" data-act="archive" data-id="${g.id}">העבר לארכיון</button>`:''}${st==='archived'?`<button class="btn" data-act="resume" data-id="${g.id}">שחזר מהארכיון</button>`:''}
 ${st==='active'||st==='paused'?`<button class="btn" data-act="archive" data-id="${g.id}">העבר לארכיון</button>`:''}<button class="btn bad" data-act="delgoal" data-id="${g.id}">מחק יעד</button></div></div>`}
const mile=p=>p>=100?'הושג':p>=75?'כמעט שם':p>=50?'חצי הדרך':p>=25?'התחלה טובה':'';
function hint(){const a=S.goals.filter(g=>g.status==='active'&&saved(g)<g.target).sort((x,y)=>pct(y)-pct(x))[0];if(!a)return '';const p=pct(a);return `<p class="hint">${p>=75?'כמעט שם: ':p>=50?'מעל חצי הדרך: ':'הצעד הבא: '}${esc(a.name)} · נשארו ${fmt(left(a))}</p>`}
function prev(){const f=$('#modal form[data-form=money]'),el=$('#prev');if(!f||!el)return;const g=G(f.dataset.gid),a=parseAmt($('#amt').value);if(!(a>0)){el.textContent='';return}const n=saved(g)+a;el.textContent=n>=g.target?'עם ההפקדה הזו תשלים את היעד!':`אחרי ההפקדה: ${Math.floor(n/g.target*100)}%, נותרו ${fmt(g.target-n)}`}
const TK='hisachon-theme';
function theme(){let t=null;try{t=localStorage.getItem(TK)}catch(e){}return t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function applyTheme(t){document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0E1A1B':'#0F766E'}
const thIco=()=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${theme()==='dark'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>':'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>'}</svg>`;
const LP={};
function draw(){$('#app').innerHTML=ui.view==='detail'?detail():home();document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k,p=+el.dataset.p,o=LP[k];LP[k]=p;if(o===undefined||o===p)return;const C=2*Math.PI*52,ring=el.tagName==='circle',set=v=>{if(ring)el.style.strokeDashoffset=C*(1-v/100);else el.style.width=v+'%'};set(o);requestAnimationFrame(()=>requestAnimationFrame(()=>set(p)))})}
function modal(h){$('#modal').innerHTML=`<div class="ov" data-act="ovclose"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`;const f=$('#modal input:not([type=radio]):not([type=file]),#modal .btn');f&&f.focus()}
const closeModal=()=>{$('#modal').innerHTML=''};
function ask(text,label,fn,bad){cb=fn;modal(`<h2>${text}</h2><div class="acts"><button class="btn ${bad?'bad':'pri'}" data-act="ok">${label}</button><button class="btn ghost" data-act="close">ביטול</button></div>`)}
function err(m){$('#err').textContent=m}
function goalForm(id){
 const g=id?G(id):{name:'',target:'',cat:'טכנולוגיה',icon:'target',date:'',note:''};
 modal(`<form data-form="goal" data-id="${id||''}"><h2>${id?'עריכת יעד':'יעד חדש'}</h2>
 <label>שם היעד<input id="f-name" maxlength="40" required value="${esc(g.name)}" placeholder="המחשב החדש שלי"></label>
 <label>סכום היעד (₪)<input id="f-target" inputmode="decimal" required value="${g.target}" placeholder="6000"></label>
 ${id?'':'<label>כבר חסכתי (לא חובה)<input id="f-init" inputmode="decimal" placeholder="0"></label>'}
 <label>קטגוריה<select id="f-cat">${CATS.map(c=>`<option ${c===g.cat?'selected':''}>${c}</option>`).join('')}</select></label>
 <div style="margin-top:12px;font-weight:500">אייקון (לא חובה)</div><div class="icons">${['none'].concat(ICONS).map(i=>`<label><input type="radio" name="ic" value="${i}" ${i===g.icon?'checked':''}><span>${i==='none'?'<small>ללא</small>':ico(i)}</span></label>`).join('')}</div>
 <label>תאריך יעד (לא חובה)<input id="f-date" type="date" value="${g.date||''}"></label>
 <label>הערה (לא חובה)<input id="f-note" maxlength="120" value="${esc(g.note)}"></label>
 <div class="err" id="err" role="alert"></div><div class="acts"><button class="btn pri">שמור</button><button type="button" class="btn ghost" data-act="close">ביטול</button></div></form>`)}
function moneyForm(type,gid,txid){
 const g=G(gid),tx=txid&&g.tx.find(t=>t.id===txid),wd=type==='wd';
 modal(`<form data-form="money" data-type="${type}" data-gid="${gid}" data-txid="${txid||''}"><h2>${txid?'עריכת פעולה':wd?'רישום משיכה':'הוספת כסף'}</h2><div class="mut">${esc(g.name)}</div>
 ${!txid&&!wd?`<div class="q">${[50,100,200,500].map(a=>`<button type="button" data-act="qa" data-v="${a}">${a} ₪</button>`).join('')}</div>`:''}
 <label>סכום (₪)<input id="amt" inputmode="decimal" autocomplete="off" required value="${tx?tx.amount:''}"></label>${!txid&&!wd?'<div class="prev" id="prev"></div>':''}
 <label>הערה (לא חובה)<input id="note" maxlength="80" value="${tx?esc(tx.note):''}"></label>
 <div class="err" id="err" role="alert"></div><div class="acts"><button class="btn pri">אישור</button><button type="button" class="btn ghost" data-act="close">ביטול</button></div></form>`)}
function settings(){modal(`<h2>הגדרות</h2><p class="mut">הנתונים נשמרים בדפדפן של המכשיר הזה בלבד ואינם מסונכרנים בין מכשירים. כדי לא לאבד אותם, או כדי להעביר למכשיר אחר, ייצא גיבוי וייבא אותו שם.</p>
 <div class="acts"><button class="btn pri" data-act="export">ייצוא גיבוי</button><label class="btn" style="margin:0;text-align:center">ייבוא מגיבוי<input type="file" id="imp" accept="application/json,.json" hidden></label></div>
 <div class="acts"><button class="btn bad" data-act="wipe">מחק את כל הנתונים</button><button class="btn ghost" data-act="close">סגור</button></div>`)}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const cs=['#0F766E','#F59E0B','#D5EAE6','#FDEBC8'];for(let i=0;i<14;i++){const s=document.createElement('i');s.className='cf';s.style.cssText=`left:${Math.random()*100}vw;background:${cs[i%4]};animation-delay:${Math.random()*.5}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),2800)}}
function checkDone(g){if(g.status==='active'&&saved(g)>=g.target){confetti();modal(`<div class="cele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-7"/></svg><h2>הגעת ליעד!</h2><p>${esc(g.name)}: ${fmt(saved(g))} מתוך ${fmt(g.target)} (100%)</p><div class="acts"><button class="btn pri" data-act="complete" data-id="${g.id}">סמן כהושלם</button><button class="btn ghost" data-act="close">המשך לחסוך</button></div></div>`)}}
function setStatus(id,s,m){const g=G(id);g.status=s;save();closeModal();draw();toast(m)}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hisachon-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('הגיבוי הורד')}
function validData(d){return d&&Array.isArray(d.goals)&&d.goals.every(g=>g&&typeof g.id==='string'&&typeof g.name==='string'&&g.target>0&&Array.isArray(g.tx)&&g.tx.every(t=>t&&t.amount>0&&(t.type==='dep'||t.type==='wd')&&typeof t.date==='string')&&tot(g.tx)>=0)}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='ovclose'){if(e.target===t)closeModal();return}
 const m={
 home:()=>{ui.view='home';ui.tab='active';closeModal();draw();scrollTo(0,0)},theme:()=>{const t=theme()==='dark'?'light':'dark';try{localStorage.setItem(TK,t)}catch(e){}applyTheme(t);draw()},tab:()=>{ui.tab=t.dataset.v;draw()},open:()=>{ui.view='detail';ui.gid=id;draw();scrollTo(0,0)},back:()=>{ui.view='home';draw()},
 new:()=>goalForm(),edit:()=>goalForm(id),add:()=>moneyForm('dep',id),wd:()=>moneyForm('wd',id),
 qa:()=>{$('#amt').value=t.dataset.v;prev();document.querySelectorAll('.q button').forEach(b=>b.classList.toggle('on',b===t))},
 txedit:()=>moneyForm(t.dataset.type,ui.gid,id),
 txdel:()=>ask('למחוק את הפעולה?','מחק',()=>{const g=G(ui.gid),tx=g.tx.filter(x=>x.id!==id);if(tot(tx)<0)return toast('אי אפשר למחוק: היתרה תהיה שלילית',1);g.tx=tx;save();draw();toast('הפעולה נמחקה')},1),
 pause:()=>setStatus(id,'paused','היעד הושהה'),resume:()=>setStatus(id,'active','היעד פעיל'),
 complete:()=>setStatus(id,'completed','כל הכבוד! היעד הושלם'),archive:()=>setStatus(id,'archived','היעד הועבר לארכיון'),
 delgoal:()=>ask('למחוק את היעד וכל ההיסטוריה שלו?','מחק יעד',()=>{S.goals=S.goals.filter(g=>g.id!==id);save();ui.view='home';draw();toast('היעד נמחק')},1),
 settings:settings,export:exportData,close:closeModal,
 ok:()=>{const f=cb;closeModal();f&&f()},
 wipe:()=>ask('למחוק את כל הנתונים? אי אפשר לשחזר.','מחק הכול',()=>{S={v:1,goals:[]};save();ui.view='home';draw();toast('הנתונים נמחקו')},1)}[a];
 m&&m()});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form;if(!f||Date.now()-lastSub<700)return;lastSub=Date.now();
 if(f==='goal'){
  const id=e.target.dataset.id,name=$('#f-name').value.trim(),target=parseAmt($('#f-target').value),ic=document.querySelector('input[name=ic]:checked'),init=id?0:($('#f-init').value.trim()===''?0:parseAmt($('#f-init').value));
  if(!name)return err('נא להזין שם ליעד');if(!(target>0)||target>1e9)return err('סכום היעד חייב להיות גדול מאפס');if(!(init>=0)||init>1e9)return err('הסכום שנחסך אינו תקין');
  const d={name,target,cat:$('#f-cat').value,icon:ic?ic.value:'target',date:$('#f-date').value,note:$('#f-note').value.trim()};let g;
  if(id){g=G(id);Object.assign(g,d)}else{g=Object.assign({id:uid(),status:'active',created:new Date().toISOString(),tx:init>0?[{id:uid(),type:'dep',amount:init,note:'סכום פתיחה',date:new Date().toISOString()}]:[]},d);S.goals.push(g);ui.tab='active'}
  save();closeModal();draw();toast(id?'היעד עודכן':'היעד נוצר');checkDone(g)}
 if(f==='money'){
  const {type,gid,txid}=e.target.dataset,amt=parseAmt($('#amt').value),note=$('#note').value.trim(),g=G(gid);
  if(!(amt>0)||amt>1e9)return err('נא להזין סכום גדול מאפס');
  const tx=txid?g.tx.map(t=>t.id===txid?Object.assign({},t,{amount:amt,note}):t):g.tx.concat([{id:uid(),type,amount:amt,note,date:new Date().toISOString()}]);
  if(tot(tx)<0)return err('הפעולה תגרום ליתרה שלילית. היתרה כרגע '+fmt(saved(g)));
  g.tx=tx;save();closeModal();draw();toast(txid?'הפעולה עודכנה':type==='wd'?'המשיכה נרשמה':'עוד '+fmt(amt)+' בדרך למטרה שלך!');if(type==='dep')checkDone(g)}});
document.addEventListener('change',e=>{
 if(e.target.id!=='imp'||!e.target.files[0])return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!validData(d))throw 0;ask('לייבא את הגיבוי? הנתונים הנוכחיים יוחלפו.','ייבא',()=>{S={v:1,goals:d.goals};save();ui.view='home';draw();toast('הגיבוי נטען')})}catch(x){toast('הקובץ אינו גיבוי תקין',1)}};r.readAsText(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.id==='amt')prev()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
applyTheme(theme());$('#app').classList.add('first');draw();setTimeout(()=>$('#app').classList.remove('first'),1300);
</script>
</body>
</html>
